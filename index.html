<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ipswich &amp; District Federation Bowls League</title>
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('bowls-theme')
          document.documentElement.dataset.bowlsTheme =
            s === 'light' || s === 'dark' ? s : 'dark'
        } catch (e) {
          document.documentElement.dataset.bowlsTheme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
